name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      # v8 supports golangci-lint v2 (the repo's .golangci.yml is `version: "2"`);
      # pin the linter version to match local so CI and developers agree.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  docs:
    name: docs lint + length budget + SEO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Lint-only (no autoformat): enforces fenced-code languages (MD040) and the
      # kramdown blank-line rules (MD022/031/032) so the Jekyll/kramdown site never
      # silently mis-renders a table/list. Config: .markdownlint.jsonc.
      - run: npx --yes markdownlint-cli2 "docs/**/*.md" "ROADMAP.md" "skills/**/*.md"
      # File-length budget: Markdown docs <= 450, Go source <= 700 lines (CLAUDE.md §4).
      - run: ./scripts/check-lengths.sh
      # SEO/GEO: required files exist, sitemap matches sidebar, llms-full.txt is fresh.
      - run: ./scripts/check-seo.sh
