# Parser extension template — multi-branch method/service gating.
# Routes extraction by service and method name, handling null fields safely.
# Test with: secopsctl ingest parsers run <LOG_TYPE> --cbn EXTENSION_MULTI_BRANCH.conf --logs samples.txt --statedump
filter {
  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }

  if [_not_json] {
    drop { tag => "TAG_UNSUPPORTED" }
  } else {
    # Extract service and method in separate blocks — either can be null.
    mutate {
      replace => {
        "_service" => "%{protoPayload.serviceName}"
      }
      on_error => "_no_svc"
    }
    mutate {
      replace => {
        "_method" => "%{protoPayload.methodName}"
      }
      on_error => "_no_method"
    }

    # Branch by method name. Use regex for method families.
    if ![_no_method] and [_method] =~ "SetIamPolicy" {
      # IAM policy changes — shared structure across services.
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "USER_RESOURCE_UPDATE_PERMISSIONS"
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    } else if ![_no_svc] and [_service] == "compute.googleapis.com" {
      # Service-specific extraction.
      mutate {
        replace => {
          "event.idm.read_only_udm.metadata.event_type" => "STATUS_UPDATE"
        }
      }
      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
    # No @output merge in else = base parser handles unmatched logs unchanged.
  }
}
