# Parser extension template — syslog key-value extraction.
# Handles JSON-escaped quotes from Cloud Logging (\") using grok.
# Test with: secopsctl ingest parsers run <LOG_TYPE> --cbn EXTENSION_SYSLOG_KV.conf --logs samples.txt --statedump
filter {
  # Extract key-value fields from syslog embedded in Cloud Logging JSON.
  # Cloud Logging wraps syslog in a JSON envelope, so quoted values appear as
  # key=\"value\" in the raw bytes. Standard %{DATA} truncates at \"; use
  # double-escaped backslash-quote to match the literal.
  grok {
    match => {
      "message" => "devname=\\\\\"%{DATA:_devname}\\\\\""
    }
    on_error => "_no_devname"
  }

  grok {
    match => {
      "message" => "srcip=\\\\\"%{IP:_srcip}\\\\\""
    }
    on_error => "_no_srcip"
  }

  if ![_no_devname] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.asset.hostname" => "%{_devname}"
      }
    }
  }

  if ![_no_srcip] {
    mutate {
      replace => {
        "event.idm.read_only_udm.principal.ip" => "%{_srcip}"
      }
    }
  }

  if ![_no_devname] or ![_no_srcip] {
    mutate {
      merge => {
        "@output" => "event"
      }
    }
  }
}
