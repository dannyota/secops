# Parser extension template — JSON log source.
# Extracts a field from a JSON payload and maps it to a UDM field.
# Test with: secopsctl ingest parsers run <LOG_TYPE> --cbn EXTENSION_JSON.conf --logs samples.txt --statedump
filter {
  mutate {
    replace => {
      "jsonPayload.fieldName" => ""
    }
  }

  json {
    source => "message"
    array_function => "split_columns"
    on_error => "_not_json"
  }

  if [_not_json] {
    drop { tag => "TAG_UNSUPPORTED" }
  } else {
    # Extract — split nullable fields into separate blocks.
    mutate {
      replace => {
        "_extracted" => "%{jsonPayload.fieldName}"
      }
      on_error => "_no_field"
    }

    if ![_no_field] and [_extracted] != "" {
      mutate {
        replace => {
          "event.idm.read_only_udm.additional.fields.merge_label.key" => "fieldName"
          "event.idm.read_only_udm.additional.fields.merge_label.value.string_value" => "%{_extracted}"
        }
      }

      mutate {
        merge => {
          "event.idm.read_only_udm.additional.fields" => "event.idm.read_only_udm.additional.fields.merge_label"
        }
      }

      mutate {
        merge => {
          "@output" => "event"
        }
      }
    }
  }
}
