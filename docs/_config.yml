# GitHub Pages (Jekyll) config — serves the docs/ folder as the project site.
# The Markdown files stay clean (no per-file front matter); the layout is applied
# to every page via front-matter defaults below.
title: secopsctl
description: Operate Google SecOps (Chronicle SIEM + Siemplify SOAR) as code
# Custom domain serves at the root (secops.danny.vn/), so no path prefix.
baseurl: ""
# Clean URLs site-wide: ARCHITECTURE.md -> /ARCHITECTURE/ (no .html anywhere).
permalink: pretty

defaults:
  - scope:
      path: ""
    values:
      layout: default
