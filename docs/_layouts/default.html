<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <style>
    :root { --fg:#1f2328; --muted:#59636e; --bg:#fff; --accent:#0969da;
            --border:#d1d9e0; --codebg:#f6f8fa; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--fg); background:var(--bg);
      font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; }
    .wrap { max-width:880px; margin:0 auto; padding:0 24px; }
    header.site { border-bottom:1px solid var(--border); background:#f6f8fa; padding:14px 0; }
    header.site a { color:var(--fg); text-decoration:none; font-weight:700; font-size:18px; }
    header.site .tag { color:var(--muted); font-weight:400; font-size:14px; margin-left:10px; }
    main { padding:36px 0 72px; }
    a { color:var(--accent); text-decoration:none; }
    a:hover { text-decoration:underline; }
    h1,h2,h3,h4 { line-height:1.25; margin:1.6em 0 .6em; font-weight:600; }
    h1 { font-size:2em; border-bottom:1px solid var(--border); padding-bottom:.3em; }
    h2 { font-size:1.5em; border-bottom:1px solid var(--border); padding-bottom:.3em; }
    code { background:var(--codebg); padding:.2em .4em; border-radius:6px; font-size:85%;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    pre { background:var(--codebg); padding:16px; border-radius:6px; overflow:auto; }
    pre code { background:none; padding:0; font-size:100%; }
    blockquote { margin:0; padding:0 1em; color:var(--muted);
      border-left:.25em solid var(--border); }
    table { border-collapse:collapse; display:block; width:max-content; max-width:100%; overflow:auto; }
    th,td { border:1px solid var(--border); padding:6px 13px; }
    th { background:var(--codebg); }
    tr:nth-child(2n) td { background:#f6f8fa; }
    img { max-width:100%; }
    hr { border:0; border-top:1px solid var(--border); margin:28px 0; }
    .mermaid { text-align:center; margin:24px 0; }
    sub, .footnote { color:var(--muted); }
  </style>
</head>
<body>
  <header class="site"><div class="wrap">
    <a href="{{ '/' | relative_url }}">secopsctl</a><span class="tag">docs</span>
  </div></header>
  <main><div class="wrap">{{ content }}</div></main>

  <!-- Render ```mermaid fenced blocks (kramdown emits div.language-mermaid).
       Pinned + Subresource Integrity so a CDN compromise can't inject script. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"
          integrity="sha384-R63zfMfSwJF4xCR11wXii+QUsbiBIdiDzDbtxia72oGWfkT7WHJfmD/I/eeHPJyT"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    window.addEventListener('load', function () {
      // GitHub Pages (kramdown) emits ```mermaid as <pre><code class="language-mermaid">;
      // some setups wrap it in <div class="language-mermaid">. Handle both.
      document.querySelectorAll('.language-mermaid').forEach(function (el) {
        var pre = document.createElement('pre');
        pre.className = 'mermaid';
        pre.textContent = el.textContent;
        var target = el.closest('div.language-mermaid') || el.closest('pre') || el;
        target.parentNode.replaceChild(pre, target);
      });
      if (window.mermaid && document.querySelector('pre.mermaid')) {
        mermaid.initialize({ startOnLoad: false, theme: 'default' });
        mermaid.run({ querySelector: 'pre.mermaid' });
      }
    });
  </script>
</body>
</html>
