<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">

  <!-- Set the theme before first paint to avoid a flash. Absent attribute = auto. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <style>
    /* ============ terminal / hacker theme ============ */
    /* light = "paper terminal" (default) */
    :root {
      --bg:#fbfbf6; --surface:#f1f2ea; --surface-2:#e6e8da; --text:#1c2530;
      --muted:#5c6b6a; --border:#d7dbc6; --accent:#1a7f37; --accent2:#0a7c8c;
      --sel:rgba(26,127,55,.16); --glow:none;
      --mono:ui-monospace,"JetBrains Mono","Fira Code",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
      --radius:6px; --maxw:900px;
    }
    /* dark = phosphor terminal (explicit choice, or auto when the OS is dark) */
    :root[data-theme="dark"] {
      --bg:#0a0e14; --surface:#0f141c; --surface-2:#161d28; --text:#c9d1d9;
      --muted:#6e7681; --border:#1f2933; --accent:#3fb950; --accent2:#56d4dd;
      --sel:rgba(63,185,80,.22); --glow:0 0 8px rgba(63,185,80,.35);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg:#0a0e14; --surface:#0f141c; --surface-2:#161d28; --text:#c9d1d9;
        --muted:#6e7681; --border:#1f2933; --accent:#3fb950; --accent2:#56d4dd;
        --sel:rgba(63,185,80,.22); --glow:0 0 8px rgba(63,185,80,.35);
      }
    }

    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--text); background:var(--bg);
      font:15px/1.65 var(--mono); -webkit-font-smoothing:antialiased; }
    ::selection { background:var(--sel); }
    .wrap { max-width:var(--maxw); margin:0 auto; padding:0 22px; }

    /* ---- terminal title-bar header ---- */
    header.site { position:sticky; top:0; z-index:20; background:var(--surface);
      border-bottom:1px solid var(--border); }
    header.site .bar { display:flex; align-items:center; justify-content:space-between; height:44px; }
    .brand { font-weight:600; font-size:14px; color:var(--text); text-decoration:none; letter-spacing:.2px; }
    .brand .prompt { color:var(--accent); text-shadow:var(--glow); }
    .brand:hover { text-decoration:none; }
    .cursor { color:var(--accent); font-weight:700; text-shadow:var(--glow);
      animation:blink 1.1s step-end infinite; margin-left:1px; }
    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }

    .toggle { font:inherit; font-size:12px; line-height:1; cursor:pointer; color:var(--text);
      background:var(--bg); border:1px solid var(--border); border-radius:5px;
      padding:6px 9px; display:inline-flex; gap:6px; align-items:center; min-width:72px; justify-content:center; }
    .toggle:hover { border-color:var(--accent); color:var(--accent); }

    main { padding:26px 0 90px; }
    main > .wrap > :first-child { margin-top:0; }

    a { color:var(--accent2); text-decoration:none; border-bottom:1px solid transparent; }
    a:hover { border-bottom-color:currentColor; }

    h1,h2,h3,h4 { line-height:1.3; margin:1.6em 0 .55em; font-weight:700; color:var(--text); }
    h1 { font-size:1.7em; color:var(--accent); text-shadow:var(--glow);
      padding-bottom:.3em; border-bottom:1px solid var(--border); }
    h2 { font-size:1.32em; padding-bottom:.3em; border-bottom:1px solid var(--border); }
    h2::before { content:"# "; color:var(--accent2); }
    h3 { font-size:1.12em; }
    h3::before { content:"## "; color:var(--muted); }
    p { margin:0 0 1em; }
    strong { color:var(--text); }

    code { background:var(--surface); padding:.16em .42em; border-radius:5px; font-size:90%;
      border:1px solid var(--border); }
    pre { background:var(--surface); padding:15px 16px; border-radius:var(--radius);
      border:1px solid var(--border); overflow:auto; }
    pre code { background:none; padding:0; border:0; font-size:92%; }
    blockquote { margin:1em 0; padding:.4em 1em; color:var(--muted);
      border-left:3px solid var(--accent); background:var(--surface);
      border-radius:0 var(--radius) var(--radius) 0; }
    blockquote > :last-child { margin-bottom:0; }

    table { border-collapse:collapse; display:block; width:max-content; max-width:100%;
      overflow:auto; margin:0 0 1em; font-size:92%; }
    th,td { border:1px solid var(--border); padding:7px 12px; text-align:left; vertical-align:top; }
    th { background:var(--surface-2); font-weight:700; color:var(--accent); }
    tr:nth-child(2n) td { background:var(--surface); }

    img { max-width:100%; }
    hr { border:0; border-top:1px solid var(--border); margin:26px 0; }
    sub,.footnote { color:var(--muted); }

    /* ---- mermaid diagram card ---- */
    pre.mermaid { background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:20px; margin:24px 0; text-align:center; }
    pre.mermaid svg { max-width:100%; height:auto; }

    /* thin terminal scrollbars (webkit) */
    ::-webkit-scrollbar { height:10px; width:10px; }
    ::-webkit-scrollbar-thumb { background:var(--border); border-radius:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
  </style>
</head>
<body>
  <header class="site"><div class="wrap bar">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="prompt">secopsctl:~$</span> docs<span class="cursor">█</span></a>
    <button id="theme-toggle" class="toggle" type="button" aria-label="Toggle theme">◐ Auto</button>
  </div></header>

  <main><div class="wrap">{{ content }}</div></main>

  <!-- Pinned + Subresource Integrity so a CDN compromise can't inject script. -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js"
          integrity="sha384-R63zfMfSwJF4xCR11wXii+QUsbiBIdiDzDbtxia72oGWfkT7WHJfmD/I/eeHPJyT"
          crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    (function () {
      var DIAGRAMS = []; // {el, src} so diagrams can re-render on theme change
      var ICON = { auto:'◐', light:'☀', dark:'☾' }, LABEL = { auto:'Auto', light:'Light', dark:'Dark' };

      function mode() { try { return localStorage.getItem('theme') || 'auto'; } catch (e) { return 'auto'; } }
      function isDark() {
        var m = mode();
        if (m === 'dark') return true;
        if (m === 'light') return false;
        return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      }
      function paintMermaid() {
        if (!window.mermaid || !DIAGRAMS.length) return;
        mermaid.initialize({ startOnLoad:false, theme: isDark() ? 'dark' : 'neutral' });
        DIAGRAMS.forEach(function (d) { d.el.removeAttribute('data-processed'); d.el.textContent = d.src; });
        mermaid.run({ querySelector: 'pre.mermaid' });
      }
      function updateToggle() {
        var b = document.getElementById('theme-toggle'); if (!b) return;
        var m = mode();
        b.textContent = ICON[m] + ' ' + LABEL[m];
        b.setAttribute('aria-label', 'Theme: ' + LABEL[m] + ' — click to change');
      }
      function setMode(m) {
        if (m === 'auto') document.documentElement.removeAttribute('data-theme');
        else document.documentElement.setAttribute('data-theme', m);
        try { localStorage.setItem('theme', m); } catch (e) {}
        updateToggle(); paintMermaid();
      }

      window.addEventListener('load', function () {
        // GitHub Pages/kramdown emits ```mermaid as <pre><code class="language-mermaid">;
        // some setups use <div class="language-mermaid">. Handle both.
        document.querySelectorAll('.language-mermaid').forEach(function (el) {
          var src = el.textContent;
          var pre = document.createElement('pre');
          pre.className = 'mermaid';
          pre.textContent = src;
          var target = el.closest('div.language-mermaid') || el.closest('pre') || el;
          target.parentNode.replaceChild(pre, target);
          DIAGRAMS.push({ el: pre, src: src });
        });
        paintMermaid();
        updateToggle();

        var b = document.getElementById('theme-toggle');
        if (b) b.addEventListener('click', function () {
          var order = ['auto', 'light', 'dark'];
          setMode(order[(order.indexOf(mode()) + 1) % 3]);
        });
        if (window.matchMedia) {
          window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
            if (mode() === 'auto') paintMermaid();
          });
        }
      });
    })();
  </script>
</body>
</html>
